services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openpims
      POSTGRES_PASSWORD: openpims
      POSTGRES_DB: openpims
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpims"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://openpims:openpims@postgres:5432/openpims"
      NEXTAUTH_SECRET: "docker-dev-secret-change-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STORAGE_DRIVER: "local"
      LOCAL_UPLOAD_DIR: "/app/uploads"
    volumes:
      - web_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Optional S3-compatible storage for testing STORAGE_DRIVER=s3.
  # Start with: docker compose -f docker/docker-compose.yml --profile storage up -d minio minio-bootstrap
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["storage"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: openpims
      MINIO_ROOT_PASSWORD: openpims123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-bootstrap:
    image: minio/mc:latest
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 openpims openpims123; do
        sleep 1;
      done;
      mc mb --ignore-existing local/openpims;
      "

volumes:
  postgres_data:
  web_uploads:
  minio_data:
